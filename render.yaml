# Render Blueprint: the backend API as one free Docker web service.
# Create it from the Render dashboard: New > Blueprint > pick this repo.
# Values marked sync: false are asked for once, when the Blueprint is created.
services:
  - type: web
    name: thriftbite-api
    runtime: docker
    plan: free
    region: singapore              # closest Render region to Baguio
    branch: main
    rootDir: backend               # changes outside backend/ don't redeploy
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: checksPass  # deploy only after GitHub Actions CI passes
    healthCheckPath: /actuator/health/liveness
    envVars:
      # Neon: Dashboard > Connect > Java. Looks like
      # jdbc:postgresql://ep-xxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true        # random 256-bit key, made once by Render
      - key: APP_ADMIN_USERNAME
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false                # at least 12 characters
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false                # the Vercel URL, e.g. https://thriftbite.vercel.app
      - key: APP_DEMO_ENABLED
        value: "true"              # one-tap demo accounts; data resets every 6 hours
      - key: APP_EXPIRY_INTERVAL
        value: PT30M               # requests release missed pickups anyway; rarer runs let Neon sleep
      - key: SPRING_DOCKER_COMPOSE_ENABLED
        value: "false"
