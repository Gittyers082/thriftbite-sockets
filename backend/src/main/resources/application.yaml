spring:
  application:
    name: thriftbite

  # Locally, the database connection comes from compose.yaml (Docker Compose support).
  # In production, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and
  # SPRING_DATASOURCE_PASSWORD as environment variables (see .env.example).

  datasource:
    hikari:
      # Small pool that empties when idle. Neon's free database sleeps after 5 minutes
      # without queries; an idle pool with keepalive pings would keep it awake all month.
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000          # ms (Hikari takes plain milliseconds)
      keepalive-time: 0

  jpa:
    open-in-view: false          # keep database access inside services, not views
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks it matches

  flyway:
    locations: classpath:db/migration

  servlet:
    multipart:
      # Photo uploads. The app's own pages shrink a photo to well under 1 MB before sending it.
      max-file-size: 6MB
      max-request-size: 7MB

  mvc:
    problemdetails:
      enabled: true            # errors use the standard RFC 9457 "problem details" JSON

server:
  port: ${PORT:8080}             # Render and similar hosts provide PORT
  shutdown: graceful             # finish in-flight requests when Render redeploys
  tomcat:
    # Read (and throw away) the rest of an upload that's over the limit, so the browser
    # gets the "too big" answer instead of a dropped connection.
    max-swallow-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health/liveness answers without touching the database, so Render's
      # health checks and uptime pings don't keep Neon awake.
      probes:
        enabled: true

app:
  jwt:
    # HMAC signing key, at least 32 characters. If unset, a random key is generated
    # at startup (fine for local dev; tokens stop working after a restart).
    secret: ${APP_JWT_SECRET:}
    ttl: PT8H
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    # Creates the first admin account on startup if it doesn't exist yet.
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
  expiry:
    # How often ExpiryJob expires old food and missed pickups (ISO-8601 durations)
    interval: ${APP_EXPIRY_INTERVAL:PT5M}
    initial-delay: PT1M
    # It also runs before requests that touch stock, at most this often, so a host
    # that put the app to sleep doesn't leave missed pickups holding food.
    lazy-min-gap: PT30S
  reservations:
    # Reserving is free (buyers pay at the counter), so cap how much one buyer can hold.
    max-active-per-buyer: 2
    # Wrong claim codes before code entry for that reservation pauses, and for how long.
    max-code-attempts: 5
    code-lock: PT15M
    # Missing this many pickups within the window pauses reserving for the block length.
    missed-pickups-before-block: 2
    missed-pickup-window: P30D
    missed-pickup-block: P7D
  demo:
    # One-tap Buyer / Store owner / Admin accounts with sample Baguio data, for the
    # public demo. WARNING: a reset deletes every account except the bootstrap admin.
    enabled: ${APP_DEMO_ENABLED:false}
    max-age: PT6H
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    # Header the host's proxy puts the visitor's address in. Without it, every visitor
    # behind the proxy shares one address and one limit. On Render: CF-Connecting-IP.
    client-ip-header: ${APP_CLIENT_IP_HEADER:}
    window: PT10M
    login-per-window: 30
    register-per-window: 5
    checkout-per-window: 20
    claim-code-per-window: 60
    # Live (WebSocket) connections opened from one address.
    live-connects-per-window: 300
    # Every API call from one address, on top of the limits above (2 a second, sustained).
    general-per-window: 1200
    # Photo uploads (each one is shrunk on the server), and photo views.
    photo-uploads-per-window: 30
    photos-per-window: 6000
    reports-per-window: 10
    # Wrong passwords in a row before one username is paused, and for how long.
    login-failures-before-lock: 5
    login-lock: PT15M
  live:
    # Open live connections at once: in total, and from one address (a classroom on one
    # Wi-Fi shares an address, so this is roomy).
    max-connections: 500
    max-connections-per-address: 60
    # Pings keep proxies from closing quiet connections.
    ping-interval: PT25S
