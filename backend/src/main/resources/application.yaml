spring:
  application:
    name: thriftbite

  # Locally, the database connection comes from compose.yaml (Docker Compose support).
  # In production, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and
  # SPRING_DATASOURCE_PASSWORD as environment variables (see .env.example).

  jpa:
    open-in-view: false          # keep database access inside services, not views
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks it matches

  flyway:
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true            # errors use the standard RFC 9457 "problem details" JSON

server:
  port: ${PORT:8080}             # Render and similar hosts provide PORT

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # HMAC signing key, at least 32 characters. If unset, a random key is generated
    # at startup (fine for local dev; tokens stop working after a restart).
    secret: ${APP_JWT_SECRET:}
    ttl: PT8H
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    # Creates the first admin account on startup if it doesn't exist yet.
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
  expiry:
    # How often ExpiryJob expires old food and missed pickups (ISO-8601 durations)
    interval: PT5M
    initial-delay: PT1M
    # It also runs before requests that touch stock, at most this often, so a host
    # that put the app to sleep doesn't leave missed pickups holding food.
    lazy-min-gap: PT30S
  reservations:
    # Reserving is free (buyers pay at the counter), so cap how much one buyer can hold.
    max-active-per-buyer: 2
    # Wrong claim codes before code entry for that reservation pauses, and for how long.
    max-code-attempts: 5
    code-lock: PT15M
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    # Header the host's proxy puts the real client address in (set when deployed).
    client-ip-header: ${APP_CLIENT_IP_HEADER:}
    window: PT10M
    login-per-window: 30
    register-per-window: 5
    checkout-per-window: 20
    claim-code-per-window: 60
    # Wrong passwords in a row before one username is paused, and for how long.
    login-failures-before-lock: 5
    login-lock: PT15M
